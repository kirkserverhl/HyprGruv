# Managed by reload-yazi-theme.sh — do not edit by hand.
# Super+W / apply-theme → flavor + folder/status overrides for theme: noir

[flavor]
dark  = "catppuccin-mocha"
light = "catppuccin-mocha"

# --- folder name + icon color (visible theme switch) ---
# Do not replace [filetype] wholesale — that would wipe flavor mime colors.
[mgr]
cwd = { fg = "#c0c0c0" }
border_style = { fg = "#555555" }

[icon]
# Tint every directory icon (and name via icon fg) to the theme accent
prepend_conds = [
  { if = "dir", text = "󰉋", fg = "#a6a6a6" },
]

# --- bottom status line (mode segment) ---
[mode]
normal_main = { fg = "#111111", bg = "#c0c0c0", bold = true }
normal_alt  = { fg = "#c0c0c0", bg = "#2a2a2a" }
select_main = { fg = "#111111", bg = "#888888", bold = true }
select_alt  = { fg = "#c0c0c0", bg = "#2a2a2a" }
unset_main  = { fg = "#111111", bg = "#a6a6a6", bold = true }
unset_alt   = { fg = "#c0c0c0", bg = "#2a2a2a" }

[tabs]
active   = { fg = "#111111", bg = "#c0c0c0", bold = true }
inactive = { fg = "#c0c0c0", bg = "#2a2a2a" }
