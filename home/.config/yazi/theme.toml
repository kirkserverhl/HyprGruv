# Managed by reload-yazi-theme.sh — do not edit by hand.
# Super+W / apply-theme → flavor + folder/status overrides for theme: nord-darker

[flavor]
dark  = "nord"
light = "nord"

# --- folder name + icon color (visible theme switch) ---
# Do not replace [filetype] wholesale — that would wipe flavor mime colors.
[mgr]
cwd = { fg = "#88C0D0" }
border_style = { fg = "#4C566A" }

[icon]
# Tint every directory icon (and name via icon fg) to the theme accent
prepend_conds = [
  { if = "dir", text = "󰉋", fg = "#81A1C1" },
]

# --- bottom status line (mode segment) ---
[mode]
normal_main = { fg = "#2E3440", bg = "#8FBCBB", bold = true }
normal_alt  = { fg = "#8FBCBB", bg = "#3B4252" }
select_main = { fg = "#2E3440", bg = "#88C0D0", bold = true }
select_alt  = { fg = "#8FBCBB", bg = "#3B4252" }
unset_main  = { fg = "#2E3440", bg = "#81A1C1", bold = true }
unset_alt   = { fg = "#8FBCBB", bg = "#3B4252" }

[tabs]
active   = { fg = "#2E3440", bg = "#8FBCBB", bold = true }
inactive = { fg = "#8FBCBB", bg = "#3B4252" }
