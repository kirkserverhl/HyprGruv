#
# User pacman config for yay — extends system config with package holds.
# Keeps /etc/pacman.conf as source of truth for repos and mirrors.
#
# These AUR packages rebuild or re-download on every `yay`/`-Syu` even when
# the installed tree is fine. Hold them here; install once via
# `yay -S --needed <pkg>` (IgnorePkg does not block first install).
#
[options]
IgnorePkg = waypaper-engine bibata-cursor-gruvbox-git

Include = /etc/pacman.conf