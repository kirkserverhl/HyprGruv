# Fallback hypridle config (used only when no machine profile exists).
# After install / apply-machine-profile.sh, autostart prefers:
#   $XDG_STATE_HOME/hyprgruv/hypridle.conf
#
# Desktop-shaped fallback: dim 13m → lock 14m → DPMS 15m → suspend 25m.
# Laptops get a tighter hibernate chain from apply-machine-profile.sh.
#
# Re-apply profile: bash ~/.hyprgruv/lib/scripts/apply-machine-profile.sh --prompt

general {
    lock_cmd = pidof hyprlock || hyprlock -c ~/.config/hypr/hyprlock/hyprlock.conf
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
}

listener {
    timeout = 840
    on-timeout = loginctl lock-session
}

listener {
    timeout = 900
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 1500
    on-timeout = bash ~/.config/hyprgruv/scripts/hyprgruv-sleep.sh suspend
}
