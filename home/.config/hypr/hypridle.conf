# Fallback hypridle config (used only when no machine profile exists).
# After install / apply-machine-profile.sh, autostart prefers:
#   $XDG_STATE_HOME/hyprgruv/hypridle.conf
#
# Desktop-shaped fallback: no idle lock, DPMS, or sleep (always on).
# Laptops get dim 4m → lock 5m → DPMS 6m → hibernate 15m from
# apply-machine-profile.sh (machine-local, not this file).
#
# Re-apply profile: bash ~/.hyprgruv/lib/scripts/apply-machine-profile.sh --prompt

general {
    lock_cmd = pidof hyprlock || hyprlock -c ~/.config/hypr/hyprlock/hyprlock.conf
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
}

# No idle listeners — this desktop stays on.
# Manual lock (Super+L / wlogout) and before_sleep_cmd still work.
