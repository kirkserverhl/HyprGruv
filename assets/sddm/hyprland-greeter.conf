# Minimal Hyprland config for the SDDM greeter (Wayland).
# Installed to /usr/share/hyprgruv/sddm/hyprland.conf by sddm_candy_install.sh.
# Keep this sparse — greeter only needs a monitor and no user session autostart.

monitor=,preferred,auto,1

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    # note: misc:vfr was removed in Hyprland ≥0.56 — do not set it (greeter red error bar)
}

decoration {
    rounding = 0
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}

animations {
    enabled = false
}

input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = false
    }
}
