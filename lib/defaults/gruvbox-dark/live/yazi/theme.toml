# Managed by reload-yazi-theme.sh — do not edit by hand.
# Super+W / apply-theme → flavor + folder/status overrides for theme: gruvbox-dark

[flavor]
dark  = "gruvbox-dark"
light = "gruvbox-dark"

# --- folder name + icon color (visible theme switch) ---
# Do not replace [filetype] wholesale — that would wipe flavor mime colors.
[mgr]
cwd = { fg = "#83a598" }
border_style = { fg = "#665c54" }

[icon]
# Tint every directory icon (and name via icon fg) to the theme accent
prepend_conds = [
  { if = "dir", text = "󰉋", fg = "#83a598" },
]

# --- bottom status line (mode segment) ---
[mode]
normal_main = { fg = "#282828", bg = "#a89984", bold = true }
normal_alt  = { fg = "#a89984", bg = "#504945" }
select_main = { fg = "#282828", bg = "#fe8019", bold = true }
select_alt  = { fg = "#a89984", bg = "#504945" }
unset_main  = { fg = "#282828", bg = "#83a598", bold = true }
unset_alt   = { fg = "#a89984", bg = "#504945" }

[tabs]
active   = { fg = "#282828", bg = "#a89984", bold = true }
inactive = { fg = "#a89984", bg = "#504945" }
