# Hyprgruv git-sync catalog (shared, committed)
# ---------------------------------------------------------------------------
# Columns (pipe-separated):
#   name | path | kind | default_source | default_deploy | description
#
# path: ~ expanded; project kind lives under ~/Projects/<name> by convention
# kind:
#   core     — always relevant (hyprgruv)
#   notes    — personal notes
#   media    — large optional libraries (wallpapers, samples)
#   project  — code/projects; home is ~/Projects/<name>
#
# default_source / default_deploy:
#   follow — included when machine profile first writes git-sync.conf
#   skip   — catalog entry only; user opts in with: git-sync follow <name>
#
# Device-local projects (never sync reminders): mark on the machine with
#   git-sync local-only <name>
# Those stay off FOLLOW and are listed under LOCAL_ONLY in git-sync.conf.
#
# Adding a new shared project:
#   1. Put the repo at ~/Projects/<name> (on the source/desktop machine)
#   2. Add a line here (kind=project, default_deploy=skip usually)
#   3. On each machine: git-sync follow <name>   # or leave skipped on laptops
# ---------------------------------------------------------------------------

hyprgruv|~/.hyprgruv|core|follow|follow|Hyprland rice / dotfiles (always)

# Full Obsidian/work vault — desktop may keep it; skip EOD until curated (use notes-shared instead)
notes|~/notes|notes|skip|skip|Full notes vault (local/opt-in; not lightweight)

# Blank curated notes for both devices — GitHub: kirkserverhl/notes_shared
notes-shared|~/Projects/notes|notes|follow|follow|Lightweight shared notes (clone notes_shared → ~/Projects/notes)

Wallpapers|~/Wallpapers|media|follow|skip|Wallpaper git library (optional; laptop often uses local Pictures/Wallpapers only)

# Shared projects (laptop = light twin: follow on both roles)
# remotes: soundsbored | proxmox-arch-lxc | 30DaysOfPy (all under kirkserverhl)
soundsbored|~/Projects/soundsbored|project|follow|follow|Soundboard — github.com/kirkserverhl/soundsbored
proxmox-arch-lxc|~/Projects/proxmox-arch-lxc|project|follow|follow|Proxmox Arch LXC bootstrap — github.com/kirkserverhl/proxmox-arch-lxc
30DaysOfPy|~/Projects/30DaysOfPy|project|follow|follow|30 Days of Python tracker — github.com/kirkserverhl/30DaysOfPy
